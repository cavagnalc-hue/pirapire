function sell(){const x=S.td[+$('#tp').value],q=Math.max(1,+$('#tq').value||1),g=$('#tg').value;if(!x)return;if(q>x.q&&!confirm('Tenés '+x.q+' en stock. ¿Vender igual?'))return;x.q=Math.max(0,x.q-q);const id=Date.now();S.vt.push({id,f:day(0),n:x.n,q,p:x.p,c:x.c,g});S.e.push({id:id+1,date:day(0),type:'ing',cat:'Tienda',desc:'Venta '+x.n+' ×'+q,amt:x.p*q,grp:g,photo:0},{id:id+2,date:day(0),type:'gas',cat:'Costo de tienda',desc:'Costo '+x.n+' ×'+q,amt:x.c*q,grp:g,photo:0});R()}

async function rfx(m){try{const[a,b]=await Promise.all([fetch('https://dolarapi.com/v1/dolares/oficial').then(r=>r.json()),fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json())]);const u=+a.venta,br=b.rates.BRL,py=b.rates.PYG;if(!u||!br||!py)throw 0;S.fx={b:u/br,p:py/u,u,at:day(0)};RATES.BRL.r=1/S.fx.b;RATES.PYG.r=S.fx.p;RATES.USD.r=1/u;R();if(m)alert('Cotizaciones actualizadas')}catch(x){if(m)alert('No pude traer las cotizaciones. Cargalas a mano en los casilleros de abajo.')}}
